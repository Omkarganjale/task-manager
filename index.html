<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tasks</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      background-color: #0d1117;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea { user-select: text; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 9999px; }
    .tap-press:active { transform: scale(0.96); transition: transform 0.08s ease-out; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Label Tag Color Themes */
    .app-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      border: 1px solid transparent;
    }
    .tag-work { background-color: #1c2c3e; color: #70a5f8; border-color: #273b54; }
    .tag-personal { background-color: #2b2238; color: #b982f5; border-color: #3b2d50; }
    .tag-finance { background-color: #1a2f23; color: #5dbb80; border-color: #244432; }
    .tag-health { background-color: #361f25; color: #f06a77; border-color: #4f2832; }
    .tag-learning { background-color: #38271a; color: #e99553; border-color: #523722; }
    .tag-default { background-color: #21262d; color: #8b949e; border-color: #30363d; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500 selection:text-white pb-24">

  <!-- TOP APP BAR -->
  <header class="sticky top-0 z-30 bg-[#0d1117]/95 backdrop-blur border-b border-[#21262d] px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      
      <!-- Brand Title -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400">
          <i data-lucide="check-square" class="w-4 h-4"></i>
        </div>
        <h1 class="text-base font-semibold tracking-tight text-white leading-tight">Tasks</h1>
      </div>

      <!-- Points Pill -->
      <div class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-500/10 border border-amber-500/25 rounded-full shadow-sm">
        <i data-lucide="award" class="w-4 h-4 text-amber-400"></i>
        <span id="pointsDisplay" class="font-bold text-sm tracking-wide text-amber-400">0</span>
        <span class="text-[10px] uppercase font-semibold text-amber-400/70">PTS</span>
      </div>

    </div>
  </header>

  <!-- MAIN WRAPPER -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-4 pt-3 pb-8 flex flex-col gap-3">

    <!-- VIEW TABS -->
    <div class="grid grid-cols-2 p-1 bg-[#161b22] border border-[#21262d] rounded-xl gap-1">
      <button id="tabTasksBtn" class="tap-press py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 bg-[#21262d] text-white shadow-sm transition-all">
        <i data-lucide="list-todo" class="w-3.5 h-3.5 text-cyan-400"></i>
        <span>Tasks</span>
      </button>
      <button id="tabRewardsBtn" class="tap-press py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 text-slate-400 hover:text-white transition-all">
        <i data-lucide="gift" class="w-3.5 h-3.5 text-amber-400"></i>
        <span>Rewards Store</span>
      </button>
    </div>

    <!-- VIEW 1: TASKS -->
    <section id="tasksView" class="flex flex-col gap-3">

      <!-- FILTER CHIPS -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 text-xs">
        <button data-filter="inbox" class="filter-chip tap-press px-2.5 py-1 rounded-lg border font-medium whitespace-nowrap bg-cyan-500/20 border-cyan-500/40 text-cyan-300">Inbox</button>
        <button data-filter="dueToday" class="filter-chip tap-press px-2.5 py-1 rounded-lg border font-medium whitespace-nowrap bg-[#161b22] border-[#21262d] text-slate-400">Due Today</button>
        <button data-filter="pastDue" class="filter-chip tap-press px-2.5 py-1 rounded-lg border font-medium whitespace-nowrap bg-[#161b22] border-[#21262d] text-slate-400">Past Due</button>
        <button data-filter="completed" class="filter-chip tap-press px-2.5 py-1 rounded-lg border font-medium whitespace-nowrap bg-[#161b22] border-[#21262d] text-slate-400">Completed</button>
        <span class="w-px h-3.5 bg-[#21262d] mx-0.5 flex-shrink-0"></span>
        <button data-filter="label:Work" class="filter-chip tap-press app-tag tag-work whitespace-nowrap">Work</button>
        <button data-filter="label:Personal" class="filter-chip tap-press app-tag tag-personal whitespace-nowrap">Personal</button>
        <button data-filter="label:Finance" class="filter-chip tap-press app-tag tag-finance whitespace-nowrap">Finance</button>
        <button data-filter="label:Health" class="filter-chip tap-press app-tag tag-health whitespace-nowrap">Health</button>
        <button data-filter="label:Learning" class="filter-chip tap-press app-tag tag-learning whitespace-nowrap">Learning</button>
      </div>

      <!-- SORT CONTROLS -->
      <div class="flex items-center justify-between text-xs text-slate-400 px-1">
        <div class="flex items-center gap-1.5">
          <i data-lucide="arrow-up-down" class="w-3 h-3 text-slate-500"></i>
          <span>Sort:</span>
          <select id="sortSelector" class="bg-[#161b22] border border-[#21262d] text-slate-200 rounded px-2 py-0.5 text-xs focus:outline-none focus:border-cyan-500 cursor-pointer">
            <option value="priority">Priority (High to Low)</option>
            <option value="dueDate">Due Date (Earliest First)</option>
            <option value="points">Points (Highest First)</option>
          </select>
        </div>
        <span id="activeCountLabel" class="text-[11px] text-slate-500">0 tasks</span>
      </div>

      <!-- TASK LIST -->
      <div id="taskList" class="flex flex-col gap-2 min-h-[200px]"></div>

    </section>

    <!-- VIEW 2: REWARDS -->
    <section id="rewardsView" class="hidden flex flex-col gap-3">
      <!-- Quick Reward Add Form -->
      <form id="rewardForm" class="bg-[#161b22] border border-[#21262d] rounded-xl p-2.5 flex items-center gap-2 shadow-sm">
        <input 
          type="text" 
          id="rewardTitleInput" 
          required 
          placeholder="New reward name..." 
          autocomplete="off"
          class="flex-1 bg-transparent px-2 py-1 text-xs sm:text-sm text-white placeholder:text-slate-500 focus:outline-none"
        />
        <div class="flex items-center bg-[#0d1117] border border-[#21262d] rounded-md px-2 py-1 text-xs">
          <span class="text-slate-500 mr-1">Cost:</span>
          <input type="number" id="rewardCostInput" value="50" min="1" class="w-12 bg-transparent text-white focus:outline-none text-xs" />
        </div>
        <button type="submit" class="tap-press px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-lg flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Add</span>
        </button>
      </form>

      <div id="rewardList" class="flex flex-col gap-2.5"></div>
    </section>

  </main>

  <!-- FLOATING ACTION BUTTON (FAB) -->
  <div class="fixed bottom-6 right-6 z-40">
    <button id="fabBtn" class="tap-press w-13 h-13 p-3.5 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center shadow-lg shadow-cyan-500/30 active:scale-95 transition-transform" title="Add New Task">
      <i data-lucide="plus" class="w-6 h-6 stroke-[2.5]"></i>
    </button>
  </div>

  <!-- MINIMAL-CLICK TASK MODAL -->
  <dialog id="taskDialog" class="bg-transparent backdrop:bg-black/75 p-3 sm:p-4 max-w-md w-full m-auto rounded-2xl">
    <div class="bg-[#161b22] border border-[#30363d] text-slate-200 rounded-2xl p-4 sm:p-5 flex flex-col gap-3.5 shadow-2xl">
      
      <div class="flex items-center justify-between border-b border-[#21262d] pb-2.5">
        <h3 class="font-semibold text-sm text-white flex items-center gap-1.5">
          <i data-lucide="check-circle" class="w-4 h-4 text-cyan-400"></i>
          <span id="modalTitleText">New Task</span>
        </h3>
        <button type="button" id="closeTaskModalBtn" class="p-1 text-slate-400 hover:text-white rounded">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="dialogTaskForm" class="flex flex-col gap-3.5">
        <!-- Title Input (Autofocused) -->
        <div>
          <input 
            type="text" 
            id="dialogTaskTitle" 
            required 
            placeholder="Task title..." 
            autocomplete="off"
            class="w-full bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-cyan-500"
          />
        </div>

        <!-- 1-Tap Priority Selector -->
        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Priority</label>
          <div class="grid grid-cols-3 gap-1.5" id="priorityPillGroup">
            <button type="button" data-val="P1" class="priority-pill tap-press py-1.5 rounded-lg border text-xs font-semibold transition-all text-center">P1 (High)</button>
            <button type="button" data-val="P2" class="priority-pill tap-press py-1.5 rounded-lg border text-xs font-semibold transition-all text-center">P2 (Med)</button>
            <button type="button" data-val="P3" class="priority-pill tap-press py-1.5 rounded-lg border text-xs font-semibold transition-all text-center">P3 (Low)</button>
          </div>
        </div>

        <!-- 1-Tap Due Date Chips -->
        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Due Date</label>
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar" id="datePillGroup">
            <button type="button" data-date="none" class="date-pill tap-press px-2.5 py-1 rounded-lg border text-xs font-medium whitespace-nowrap">None</button>
            <button type="button" data-date="today" class="date-pill tap-press px-2.5 py-1 rounded-lg border text-xs font-medium whitespace-nowrap">Today</button>
            <button type="button" data-date="tomorrow" class="date-pill tap-press px-2.5 py-1 rounded-lg border text-xs font-medium whitespace-nowrap">Tomorrow</button>
            <input type="date" id="dialogCustomDate" class="tap-press bg-[#0d1117] border border-[#21262d] text-slate-200 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-cyan-500 cursor-pointer" />
          </div>
        </div>

        <!-- 1-Tap Label Selector with Matching Colors -->
        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Label</label>
          <div class="flex flex-wrap gap-1.5" id="labelPillGroup">
            <button type="button" data-label="" class="label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-medium">None</button>
            <button type="button" data-label="Work" class="label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-medium tag-work">Work</button>
            <button type="button" data-label="Personal" class="label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-medium tag-personal">Personal</button>
            <button type="button" data-label="Finance" class="label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-medium tag-finance">Finance</button>
            <button type="button" data-label="Health" class="label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-medium tag-health">Health</button>
            <button type="button" data-label="Learning" class="label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-medium tag-learning">Learning</button>
          </div>
        </div>

        <!-- 1-Tap Points Selector -->
        <div>
          <label class="block text-[11px] font-medium text-slate-400 mb-1.5">Completion Points</label>
          <div class="flex items-center gap-1.5" id="pointsPillGroup">
            <button type="button" data-pts="5" class="pts-pill tap-press flex-1 py-1 rounded-lg border text-xs font-bold text-center">5</button>
            <button type="button" data-pts="10" class="pts-pill tap-press flex-1 py-1 rounded-lg border text-xs font-bold text-center">10</button>
            <button type="button" data-pts="25" class="pts-pill tap-press flex-1 py-1 rounded-lg border text-xs font-bold text-center">25</button>
            <button type="button" data-pts="50" class="pts-pill tap-press flex-1 py-1 rounded-lg border text-xs font-bold text-center">50</button>
            <input type="number" id="dialogCustomPts" min="0" placeholder="Custom" class="w-16 bg-[#0d1117] border border-[#21262d] rounded-lg px-2 py-1 text-xs text-white text-center focus:outline-none focus:border-cyan-500" />
          </div>
        </div>

        <!-- Footer -->
        <div class="flex items-center justify-between pt-2 border-t border-[#21262d] mt-1">
          <span class="text-[10px] text-slate-500">Press <kbd class="px-1 py-0.5 bg-[#0d1117] border border-[#30363d] rounded text-[9px]">Enter</kbd></span>
          <div class="flex gap-2">
            <button type="button" id="cancelTaskBtn" class="tap-press px-3 py-1.5 text-xs font-medium text-slate-400 hover:text-white rounded-lg">Cancel</button>
            <button type="submit" id="saveTaskBtn" class="tap-press px-4 py-1.5 text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg shadow-sm">Save Task</button>
          </div>
        </div>
      </form>

    </div>
  </dialog>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 bg-[#161b22] border border-[#30363d] text-white text-xs px-3.5 py-2 rounded-xl shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-200">
    <span id="toastMsg"></span>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    (function () {
      const APP_TAG_CLASSES = {
        Work: "app-tag tag-work",
        Personal: "app-tag tag-personal",
        Finance: "app-tag tag-finance",
        Health: "app-tag tag-health",
        Learning: "app-tag tag-learning"
      };

      const LABEL_BUTTON_THEMES = {
        "": "bg-[#0d1117] text-slate-400 border-[#21262d]",
        Work: "tag-work",
        Personal: "tag-personal",
        Finance: "tag-finance",
        Health: "tag-health",
        Learning: "tag-learning"
      };

      const state = {
        tasks: JSON.parse(localStorage.getItem("tr_tasks") || "[]"),
        rewards: JSON.parse(localStorage.getItem("tr_rewards") || "[]"),
        points: parseInt(localStorage.getItem("tr_points") || "0", 10),
        activeTab: "tasks",
        activeFilter: "inbox",
        activeSort: "priority",
        editingTaskId: null,
        dialogPriority: "P2",
        dialogDate: "",
        dialogLabel: "",
        dialogPoints: 10
      };

      function generateId() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
        return "id-" + Date.now() + "-" + Math.random().toString(36).substring(2, 9);
      }

      function escapeHtml(str) {
        if (!str) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        const toastMsg = document.getElementById("toastMsg");
        toastMsg.textContent = msg;
        toast.classList.remove("opacity-0", "pointer-events-none", "translate-y-2");
        setTimeout(() => {
          toast.classList.add("opacity-0", "pointer-events-none", "translate-y-2");
        }, 2200);
      }

      function saveLocal() {
        localStorage.setItem("tr_tasks", JSON.stringify(state.tasks));
        localStorage.setItem("tr_rewards", JSON.stringify(state.rewards));
        localStorage.setItem("tr_points", state.points.toString());
        document.getElementById("pointsDisplay").textContent = state.points;
      }

      function getTodayStr() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function getTomorrowStr() {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function isDueToday(dateStr) { return dateStr === getTodayStr(); }
      function isPastDue(dateStr) { return dateStr && dateStr < getTodayStr(); }

      // --- RENDERING TASKS ---
      function renderTasks() {
        const container = document.getElementById("taskList");
        container.innerHTML = "";

        let filtered = state.tasks.filter(t => {
          if (state.activeFilter === "completed") return t.completed;
          if (t.completed) return false;
          if (state.activeFilter === "inbox") return true;
          if (state.activeFilter === "dueToday") return isDueToday(t.dueDate);
          if (state.activeFilter === "pastDue") return isPastDue(t.dueDate);
          if (state.activeFilter.startsWith("label:")) {
            return t.label === state.activeFilter.replace("label:", "");
          }
          return true;
        });

        document.getElementById("activeCountLabel").textContent = `${filtered.length} task${filtered.length === 1 ? '' : 's'}`;

        const pWeights = { P1: 3, P2: 2, P3: 1 };
        filtered.sort((a, b) => {
          if (state.activeSort === "priority") return (pWeights[b.priority] || 0) - (pWeights[a.priority] || 0);
          if (state.activeSort === "dueDate") {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return a.dueDate.localeCompare(b.dueDate);
          }
          if (state.activeSort === "points") return (b.points || 0) - (a.points || 0);
          return 0;
        });

        if (filtered.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center p-8 text-center bg-[#161b22]/50 border border-dashed border-[#21262d] rounded-xl">
              <i data-lucide="check-circle-2" class="w-8 h-8 text-slate-600 mb-1.5"></i>
              <p class="text-xs text-slate-400 font-medium">No tasks found</p>
              <p class="text-[11px] text-slate-500 mt-0.5">Click + to add a task</p>
            </div>
          `;
          refreshIcons();
          return;
        }

        filtered.forEach(task => {
          const card = document.createElement("div");
          card.className = `p-3 bg-[#161b22] border ${task.completed ? 'border-[#21262d]/50 opacity-60' : 'border-[#21262d]'} rounded-xl flex items-start justify-between gap-2.5 transition-all`;

          const priorityBadge = {
            P1: '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/30">P1</span>',
            P2: '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/30">P2</span>',
            P3: '<span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#21262d] text-slate-400 border border-[#30363d]">P3</span>'
          }[task.priority] || "";

          let dueBadge = "";
          if (task.dueDate) {
            if (isPastDue(task.dueDate) && !task.completed) {
              dueBadge = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/30">Past Due</span>`;
            } else if (isDueToday(task.dueDate)) {
              dueBadge = `<span class="text-[10px] font-medium px-1.5 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">Today</span>`;
            } else {
              dueBadge = `<span class="text-[10px] text-slate-400">${task.dueDate}</span>`;
            }
          }

          const labelClass = APP_TAG_CLASSES[task.label] || "app-tag tag-default";
          const labelBadge = task.label ? `<span class="${labelClass}">${escapeHtml(task.label)}</span>` : "";

          card.innerHTML = `
            <div class="flex items-start gap-2.5 flex-1 min-w-0">
              <button data-task-id="${task.id}" class="task-check tap-press mt-0.5 w-4 h-4 rounded border ${task.completed ? 'bg-emerald-500 border-emerald-500 text-black' : 'border-slate-600 bg-[#0d1117]'} flex items-center justify-center transition-colors">
                ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
              </button>
              <div class="flex-1 min-w-0">
                <p class="text-xs sm:text-sm font-medium ${task.completed ? 'line-through text-slate-500' : 'text-slate-100'} truncate">${escapeHtml(task.title)}</p>
                <div class="flex flex-wrap items-center gap-1.5 mt-1.5">
                  ${priorityBadge}
                  ${labelBadge}
                  ${dueBadge}
                </div>
              </div>
            </div>
            
            <div class="flex items-center gap-1">
              <span class="text-[11px] font-bold text-amber-400/90 whitespace-nowrap mr-1">+${task.points} pts</span>
              <button data-edit-task="${task.id}" class="p-1.5 text-slate-400 hover:text-cyan-400 hover:bg-[#21262d] tap-press rounded-md transition-colors" title="Edit Task">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
              </button>
              <button data-delete-task="${task.id}" class="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-[#21262d] tap-press rounded-md transition-colors" title="Delete Task">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          `;
          container.appendChild(card);
        });

        refreshIcons();
      }

      // --- RENDERING REWARDS ---
      function renderRewards() {
        const container = document.getElementById("rewardList");
        container.innerHTML = "";

        if (state.rewards.length === 0) {
          container.innerHTML = `
            <div class="flex flex-col items-center justify-center p-8 text-center bg-[#161b22]/50 border border-dashed border-[#21262d] rounded-xl">
              <i data-lucide="gift" class="w-8 h-8 text-slate-600 mb-1.5"></i>
              <p class="text-xs text-slate-400 font-medium">Rewards catalog is empty</p>
              <p class="text-[11px] text-slate-500 mt-0.5">Add an incentive above to redeem points.</p>
            </div>
          `;
          refreshIcons();
          return;
        }

        state.rewards.forEach(reward => {
          const card = document.createElement("div");
          const canAfford = state.points >= reward.cost;
          const cost = Math.max(1, reward.cost);
          const pct = Math.min(100, Math.round((state.points / cost) * 100));

          card.className = "p-3.5 bg-[#161b22] border border-[#21262d] rounded-xl flex flex-col gap-2.5 transition-all";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-2.5">
              <div class="flex-1 min-w-0">
                <h4 class="text-xs sm:text-sm font-medium text-slate-100 truncate">${escapeHtml(reward.title)}</h4>
                <p class="text-[11px] font-semibold text-amber-400/90 mt-0.5">${reward.cost} PTS</p>
              </div>

              <div class="flex items-center gap-1.5">
                <button data-redeem-id="${reward.id}" ${!canAfford ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-all ${
                  canAfford 
                    ? 'tap-press bg-amber-600 hover:bg-amber-500 text-white shadow-sm cursor-pointer' 
                    : 'bg-[#21262d]/70 text-slate-500 cursor-not-allowed border border-[#30363d]/50 opacity-60'
                }">
                  <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                  <span>Redeem</span>
                </button>
                <button data-delete-reward="${reward.id}" class="p-1.5 text-slate-500 hover:text-rose-400 hover:bg-[#21262d] tap-press rounded-md transition-colors" title="Delete Reward">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>

            <div class="flex flex-col gap-1 pt-0.5">
              <div class="w-full bg-[#0d1117] rounded-full h-1.5 overflow-hidden border border-[#21262d]">
                <div class="h-full rounded-full transition-all duration-300 ${canAfford ? 'bg-amber-400' : 'bg-cyan-500/70'}" style="width: ${pct}%"></div>
              </div>
              <div class="flex items-center justify-between text-[10px]">
                <span class="${canAfford ? 'text-amber-400/90 font-medium' : 'text-slate-400'}">
                  ${canAfford ? 'Ready to redeem!' : `${cost - state.points} pts remaining`}
                </span>
                <span class="text-slate-500 font-medium">${pct}%</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });

        refreshIcons();
      }

      function refreshIcons() {
        if (typeof lucide !== "undefined" && lucide.createIcons) lucide.createIcons();
      }

      // --- 1-TAP PILL SYNC HELPERS (WITH COLORED LABEL BACKGROUNDS) ---
      function syncPillUI() {
        // Priority Pills
        document.querySelectorAll(".priority-pill").forEach(btn => {
          const val = btn.dataset.val;
          if (val === state.dialogPriority) {
            if (val === "P1") btn.className = "priority-pill tap-press py-1.5 rounded-lg border text-xs font-semibold text-center bg-rose-500/20 border-rose-500/60 text-rose-300";
            else if (val === "P2") btn.className = "priority-pill tap-press py-1.5 rounded-lg border text-xs font-semibold text-center bg-amber-500/20 border-amber-500/60 text-amber-300";
            else btn.className = "priority-pill tap-press py-1.5 rounded-lg border text-xs font-semibold text-center bg-slate-700/50 border-slate-500 text-white";
          } else {
            btn.className = "priority-pill tap-press py-1.5 rounded-lg border text-xs font-semibold text-center bg-[#0d1117] border-[#21262d] text-slate-400 hover:text-white";
          }
        });

        // Date Pills
        const customDateInput = document.getElementById("dialogCustomDate");
        customDateInput.value = state.dialogDate || "";
        document.querySelectorAll(".date-pill").forEach(btn => {
          const mode = btn.dataset.date;
          let isActive = false;
          if (mode === "none" && !state.dialogDate) isActive = true;
          else if (mode === "today" && state.dialogDate === getTodayStr()) isActive = true;
          else if (mode === "tomorrow" && state.dialogDate === getTomorrowStr()) isActive = true;

          if (isActive) {
            btn.className = "date-pill tap-press px-2.5 py-1 rounded-lg border text-xs font-semibold whitespace-nowrap bg-cyan-500/20 border-cyan-500/50 text-cyan-300";
          } else {
            btn.className = "date-pill tap-press px-2.5 py-1 rounded-lg border text-xs font-medium whitespace-nowrap bg-[#0d1117] border-[#21262d] text-slate-400 hover:text-white";
          }
        });

        // Label Pills: Using matching colored backgrounds + active selection ring
        document.querySelectorAll(".label-pill").forEach(btn => {
          const lbl = btn.dataset.label;
          const themeClass = LABEL_BUTTON_THEMES[lbl] || "tag-default";
          const isSelected = (lbl === state.dialogLabel);

          if (isSelected) {
            btn.className = `label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-bold transition-all ${themeClass} ring-2 ring-cyan-400 ring-offset-2 ring-offset-[#161b22] opacity-100 shadow-sm`;
          } else {
            btn.className = `label-pill tap-press px-2.5 py-1 rounded-md border text-xs font-medium transition-all ${themeClass} opacity-60 hover:opacity-100`;
          }
        });

        // Points Pills
        const customPtsInput = document.getElementById("dialogCustomPts");
        let matchedPreset = false;
        document.querySelectorAll(".pts-pill").forEach(btn => {
          const pts = parseInt(btn.dataset.pts, 10);
          if (pts === state.dialogPoints) {
            matchedPreset = true;
            btn.className = "pts-pill tap-press flex-1 py-1 rounded-lg border text-xs font-bold text-center bg-amber-500/20 border-amber-500/60 text-amber-300";
          } else {
            btn.className = "pts-pill tap-press flex-1 py-1 rounded-lg border text-xs font-bold text-center bg-[#0d1117] border-[#21262d] text-slate-400 hover:text-white";
          }
        });
        customPtsInput.value = matchedPreset ? "" : (state.dialogPoints || "");
      }

      // 1-Tap Click Listeners
      document.getElementById("priorityPillGroup").addEventListener("click", (e) => {
        const btn = e.target.closest(".priority-pill");
        if (btn) {
          state.dialogPriority = btn.dataset.val;
          syncPillUI();
        }
      });

      document.getElementById("datePillGroup").addEventListener("click", (e) => {
        const btn = e.target.closest(".date-pill");
        if (btn) {
          const mode = btn.dataset.date;
          if (mode === "none") state.dialogDate = "";
          else if (mode === "today") state.dialogDate = getTodayStr();
          else if (mode === "tomorrow") state.dialogDate = getTomorrowStr();
          syncPillUI();
        }
      });

      document.getElementById("dialogCustomDate").addEventListener("change", (e) => {
        state.dialogDate = e.target.value || "";
        syncPillUI();
      });

      document.getElementById("labelPillGroup").addEventListener("click", (e) => {
        const btn = e.target.closest(".label-pill");
        if (btn) {
          state.dialogLabel = btn.dataset.label;
          syncPillUI();
        }
      });

      document.getElementById("pointsPillGroup").addEventListener("click", (e) => {
        const btn = e.target.closest(".pts-pill");
        if (btn) {
          state.dialogPoints = parseInt(btn.dataset.pts, 10);
          syncPillUI();
        }
      });

      document.getElementById("dialogCustomPts").addEventListener("input", (e) => {
        const val = parseInt(e.target.value, 10);
        state.dialogPoints = isNaN(val) ? 0 : Math.max(0, val);
        syncPillUI();
      });

      // --- MODAL CONTROLS: CREATE & EDIT ---
      const taskDialog = document.getElementById("taskDialog");

      function openCreateModal() {
        state.editingTaskId = null;
        document.getElementById("modalTitleText").textContent = "New Task";
        document.getElementById("saveTaskBtn").textContent = "Save Task";

        state.dialogPriority = "P2";
        state.dialogPoints = 10;
        state.dialogDate = (state.activeFilter === "dueToday") ? getTodayStr() : "";
        state.dialogLabel = state.activeFilter.startsWith("label:") ? state.activeFilter.replace("label:", "") : "";

        const titleInput = document.getElementById("dialogTaskTitle");
        titleInput.value = "";

        syncPillUI();
        if (taskDialog.showModal) taskDialog.showModal();
        else taskDialog.style.display = "block";
        refreshIcons();
        requestAnimationFrame(() => titleInput.focus());
      }

      function openEditModal(taskId) {
        const task = state.tasks.find(t => t.id === taskId);
        if (!task) return;

        state.editingTaskId = taskId;
        document.getElementById("modalTitleText").textContent = "Edit Task";
        document.getElementById("saveTaskBtn").textContent = "Update Task";

        document.getElementById("dialogTaskTitle").value = task.title || "";
        state.dialogPriority = task.priority || "P2";
        state.dialogPoints = task.points !== undefined ? task.points : 10;
        state.dialogDate = task.dueDate || "";
        state.dialogLabel = task.label || "";

        syncPillUI();
        if (taskDialog.showModal) taskDialog.showModal();
        else taskDialog.style.display = "block";
        refreshIcons();
        requestAnimationFrame(() => document.getElementById("dialogTaskTitle").focus());
      }

      document.getElementById("fabBtn").addEventListener("click", () => {
        if (state.activeTab === "tasks") openCreateModal();
        else document.getElementById("rewardTitleInput").focus();
      });

      document.getElementById("closeTaskModalBtn").addEventListener("click", () => taskDialog.close());
      document.getElementById("cancelTaskBtn").addEventListener("click", () => taskDialog.close());

      // Task Form Submit
      document.getElementById("dialogTaskForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const titleInput = document.getElementById("dialogTaskTitle");
        const title = titleInput.value.trim();
        if (!title) return;

        const priority = state.dialogPriority;
        const points = state.dialogPoints;
        const dueDate = state.dialogDate || null;
        const label = state.dialogLabel || null;

        if (state.editingTaskId) {
          const task = state.tasks.find(t => t.id === state.editingTaskId);
          if (task) {
            if (task.completed && task.points !== points) {
              const diff = points - task.points;
              state.points = Math.max(0, state.points + diff);
            }
            task.title = title;
            task.priority = priority;
            task.points = points;
            task.dueDate = dueDate;
            task.label = label;
            showToast("Task updated");
          }
        } else {
          state.tasks.unshift({
            id: generateId(),
            title,
            priority,
            points,
            dueDate,
            label,
            completed: false
          });
          showToast("Task added");
        }

        saveLocal();
        renderTasks();
        renderRewards();
        taskDialog.close();
      });

      // Quick key 'n'
      window.addEventListener("keydown", (e) => {
        if (e.key === "n" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
          e.preventDefault();
          openCreateModal();
        }
      });

      // Task Item Delegation: Check, Edit, Delete
      document.getElementById("taskList").addEventListener("click", (e) => {
        const checkBtn = e.target.closest(".task-check");
        if (checkBtn) {
          const taskId = checkBtn.dataset.taskId;
          const task = state.tasks.find(t => t.id === taskId);
          if (task) {
            task.completed = !task.completed;
            if (task.completed) {
              state.points += (task.points || 0);
              showToast(`Done! +${task.points} pts`);
            } else {
              state.points = Math.max(0, state.points - (task.points || 0));
              showToast(`Unchecked -${task.points} pts`);
            }
            saveLocal();
            renderTasks();
            renderRewards();
          }
          return;
        }

        const editBtn = e.target.closest("[data-edit-task]");
        if (editBtn) {
          const taskId = editBtn.dataset.editTask;
          openEditModal(taskId);
          return;
        }

        const deleteBtn = e.target.closest("[data-delete-task]");
        if (deleteBtn) {
          const taskId = deleteBtn.dataset.deleteTask;
          const idx = state.tasks.findIndex(t => t.id === taskId);
          if (idx !== -1) {
            if (state.tasks[idx].completed) {
              state.points = Math.max(0, state.points - (state.tasks[idx].points || 0));
            }
            state.tasks.splice(idx, 1);
            saveLocal();
            renderTasks();
            renderRewards();
            showToast("Task deleted");
          }
        }
      });

      // Rewards logic
      document.getElementById("rewardForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const titleInput = document.getElementById("rewardTitleInput");
        const title = titleInput.value.trim();
        const cost = parseInt(document.getElementById("rewardCostInput").value, 10) || 1;
        if (!title) return;

        state.rewards.unshift({ id: generateId(), title, cost });
        saveLocal();
        renderRewards();
        titleInput.value = "";
        showToast("Reward added");
      });

      document.getElementById("rewardList").addEventListener("click", (e) => {
        const redeemBtn = e.target.closest("[data-redeem-id]");
        if (redeemBtn && !redeemBtn.disabled) {
          const rewardId = redeemBtn.dataset.redeemId;
          const reward = state.rewards.find(r => r.id === rewardId);
          if (reward && state.points >= reward.cost) {
            state.points -= reward.cost;
            saveLocal();
            renderRewards();
            showToast(`Redeemed "${reward.title}" (-${reward.cost} pts)`);
          }
          return;
        }

        const deleteRewardBtn = e.target.closest("[data-delete-reward]");
        if (deleteRewardBtn) {
          const rewardId = deleteRewardBtn.dataset.deleteReward;
          state.rewards = state.rewards.filter(r => r.id !== rewardId);
          saveLocal();
          renderRewards();
          showToast("Reward removed");
        }
      });

      // Tab Switching
      document.getElementById("tabTasksBtn").addEventListener("click", () => {
        state.activeTab = "tasks";
        document.getElementById("tasksView").classList.remove("hidden");
        document.getElementById("rewardsView").classList.add("hidden");
        document.getElementById("tabTasksBtn").className = "tap-press py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 bg-[#21262d] text-white shadow-sm transition-all";
        document.getElementById("tabRewardsBtn").className = "tap-press py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 text-slate-400 hover:text-white transition-all";
      });

      document.getElementById("tabRewardsBtn").addEventListener("click", () => {
        state.activeTab = "rewards";
        document.getElementById("tasksView").classList.add("hidden");
        document.getElementById("rewardsView").classList.remove("hidden");
        document.getElementById("tabRewardsBtn").className = "tap-press py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 bg-[#21262d] text-white shadow-sm transition-all";
        document.getElementById("tabTasksBtn").className = "tap-press py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-2 text-slate-400 hover:text-white transition-all";
        renderRewards();
      });

      // Filter Chips
      document.querySelectorAll(".filter-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          state.activeFilter = btn.dataset.filter;
          document.querySelectorAll(".filter-chip").forEach(b => {
            if (!b.dataset.filter.startsWith("label:")) {
              b.className = "filter-chip tap-press px-2.5 py-1 rounded-lg border font-medium whitespace-nowrap bg-[#161b22] border-[#21262d] text-slate-400";
            }
          });
          if (!btn.dataset.filter.startsWith("label:")) {
            btn.className = "filter-chip tap-press px-2.5 py-1 rounded-lg border font-medium whitespace-nowrap bg-cyan-500/20 border-cyan-500/40 text-cyan-300";
          }
          renderTasks();
        });
      });

      document.getElementById("sortSelector").addEventListener("change", (e) => {
        state.activeSort = e.target.value;
        renderTasks();
      });

      // Initial Mount
      saveLocal();
      renderTasks();
      renderRewards();
      refreshIcons();
    })();
  </script>
</body>
</html>
